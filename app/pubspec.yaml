name: postzera
description: One post, every platform.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0 <3.48.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  characters: any
  hugeicons: ^1.2.0
  google_mobile_ads: ^9.1.0
  flutter_inapp_purchase: ^11.0.3
  flutter_local_notifications: ^22.3.2
  timezone: any
  flutter_timezone: any
  share_plus: ^13.3.1
  url_launcher: any
  image_picker: any
  file_picker: any
  pro_video_editor: 2.40.0
  sqlite3: ^3.0.0
  path_provider: any
  path: any
  shared_preferences: any
  package_info_plus: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: any
  flutter_native_splash: any

flutter:
  uses-material-design: false
  generate: true
  assets:
    - assets/licenses/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
