name: smoke_android
# Manual only. Installs the release x86_64 APK of an earlier build run on an
# Android emulator, launches it and reports whether it stays alive, with the
# crash log as annotations. It builds nothing and signs nothing.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The build_and_deploy run whose APK artifact to test
        type: string
        required: true
      api_level:
        description: Android API level of the emulator
        type: choice
        default: '34'
        options: ['34', '36', '30']
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: postzera-android-apk
          path: apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash app/tool/smoke_android.sh apk/app-x86_64-release.apk 25
