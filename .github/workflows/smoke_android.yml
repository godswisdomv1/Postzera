name: smoke_android
# Manual only. Installs the release x86_64 APK of an earlier build run on an
# Android emulator, launches it and reports whether it stays alive, with the
# crash log as annotations, and publishes a screenshot to the throwaway
# smoke-shots branch (replaced on every run). It builds nothing and signs
# nothing.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The build_and_deploy run whose APK artifact to test
        type: string
        required: true
      api_level:
        description: Android API level of the emulator
        type: choice
        default: '34'
        options: ['34', '36', '30']
permissions:
  contents: write   # only to publish the screenshot to the smoke-shots branch
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: postzera-android-apk
          path: apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash app/tool/smoke_android.sh apk/app-x86_64-release.apk 25
      - name: Publish the screenshot
        if: always()
        run: |
          [ -f screen.png ] || exit 0
          cp screen.png /tmp/screen.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan smoke-shots
          git rm -rf --quiet .
          cp /tmp/screen.png "screen-${{ inputs.run_id }}.png"
          git add "screen-${{ inputs.run_id }}.png"
          git commit -q -m "smoke screenshot for run ${{ inputs.run_id }}"
          git push -f origin smoke-shots
